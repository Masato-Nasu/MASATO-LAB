<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --panel: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #d8d8d2;
      --shadow: 0 10px 28px rgba(0,0,0,.06);
      --radius: 24px;
      --max: 1180px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }
    body {
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 22px 20px 56px;
    }
    .site-header {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .site-title {
      margin: 0;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 15px;
      padding-bottom: 10px;
    }
    .nav a[aria-current="page"] { font-weight: 700; }
    .page-head {
      margin: 20px 0 24px;
    }
    .page-title {
      margin: 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 0.98;
      letter-spacing: -0.04em;
      font-weight: 700;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 28px;
      display: grid;
      gap: 20px;
    }
    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
    }
    .about-text {
      margin: 0;
      white-space: pre-wrap;
      font-size: 16px;
    }
    .empty-state,
    .error-state {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    @media (max-width: 720px) {
      .wrap { padding: 18px 14px 36px; }
      .panel { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1 class="site-title" id="site-title">MASATO NASU</h1>
      <nav class="nav" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./portfolio.html">Portfolio</a>
        <a href="./memory.html">Peripheral Memory</a>
        <a href="./tools.html">Tools</a>
        <a href="./about.html" aria-current="page">About</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <h2 class="page-title">About</h2>
      </section>
      <section id="about-root" aria-live="polite"></section>
    </main>
  </div>

  <script>
    const root = document.getElementById('about-root');
    const siteTitle = document.getElementById('site-title');

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function loadSiteData() {
      try {
        const apiResponse = await fetch('/api/data', { cache: 'no-store' });
        if (apiResponse.ok) return await apiResponse.json();
      } catch (error) {
        console.warn('API data unavailable, trying local fallback.', error);
      }
      const fallbackResponse = await fetch('./data.json', { cache: 'no-store' });
      if (!fallbackResponse.ok) throw new Error('Failed to load fallback data.json');
      return await fallbackResponse.json();
    }

    async function boot() {
      try {
        const data = await loadSiteData();
        const site = data.site || {};
        if (site.name) {
          siteTitle.textContent = site.name;
          document.title = `${site.name} / About`;
        }

        const about = String(site.about || '').trim();
        const lede = String(site.tagline || '').trim();

        if (!about && !lede) {
          root.innerHTML = '<section class="empty-state">About の情報がまだありません。Editor で About を入力して保存してください。</section>';
          return;
        }

        root.innerHTML = `
          <section class="panel">
            ${lede ? `<p class="lede">${escapeHtml(lede)}</p>` : ''}
            ${about ? `<p class="about-text">${escapeHtml(about)}</p>` : ''}
          </section>
        `;
      } catch (error) {
        console.error(error);
        root.innerHTML = '<section class="error-state">About の読み込みに失敗しました。データの保存状態を確認してください。</section>';
      }
    }

    boot();
  </script>
</body>
</html>
