<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About</title>
  <style>
    :root { --bg:#f5f5f2; --panel:#ffffff; --text:#111111; --muted:#666666; --line:#d8d8d2; --shadow:0 10px 28px rgba(0,0,0,.06); --max:1180px; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--text); }
    body { line-height:1.7; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:var(--max); margin:0 auto; padding:22px 20px 56px; }
    .site-header { display:grid; gap:10px; margin-bottom:18px; }
    .site-title { margin:0; font-size:clamp(32px,5vw,54px); line-height:.98; letter-spacing:-.03em; font-weight:700; }
    .nav { display:flex; gap:18px; flex-wrap:wrap; align-items:center; font-size:15px; padding-bottom:10px; }
    .nav a[aria-current="page"] { font-weight:700; }
    .page-head { margin:20px 0 22px; display:grid; gap:12px; }
    .eyebrow { display:inline-flex; align-items:center; width:fit-content; min-height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:#fafaf7; color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    .eyebrow:empty { display:none; }
    .page-title { margin:0; font-size:clamp(34px,6vw,68px); line-height:.98; letter-spacing:-.04em; font-weight:700; }
    .lede { margin:0; color:var(--muted); font-size:18px; white-space:pre-wrap; max-width:820px; }
    .lede:empty { display:none; }
    .about-grid { display:grid; grid-template-columns:minmax(290px,420px) minmax(0,1fr); gap:22px; align-items:start; }
    .portrait-card,.panel { background:var(--panel); border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow); overflow:hidden; }
    .portrait-wrap { position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; background:#d2d2ce; touch-action:none; user-select:none; -webkit-user-select:none; cursor:crosshair; }
    .portrait-wrap img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
    .scratch { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
    .portrait-note { padding:14px 18px 16px; color:var(--muted); font-size:12px; letter-spacing:.04em; }
    .panel { padding:28px; display:grid; gap:20px; }
    .about-text { margin:0; white-space:pre-wrap; font-size:16px; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; padding-top:4px; border-top:1px solid var(--line); }
    .stat { padding:14px 0 0; }
    .stat-label { margin:0 0 4px; color:var(--muted); font-size:10px; letter-spacing:.1em; text-transform:uppercase; }
    .stat-value { margin:0; font-size:24px; line-height:1; letter-spacing:-.03em; font-weight:700; }
    .empty-state,.error-state { background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:28px; color:var(--muted); box-shadow:var(--shadow); }
    @media (max-width:780px) { .wrap { padding:18px 14px 36px; } .about-grid { grid-template-columns:1fr; } .portrait-card { max-width:520px; } .panel { padding:22px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1 class="site-title" id="site-title">MASATO NASU</h1>
      <nav class="nav" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./portfolio.html">Portfolio</a>
        <a href="./memory.html">Peripheral Memory</a>
        <a href="./tools.html">Tools</a>
        <a href="./about.html" aria-current="page">About</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <div class="eyebrow" id="about-eyebrow"></div>
        <h2 class="page-title">About</h2>
        <p class="lede" id="about-lede"></p>
      </section>
      <section id="about-root" aria-live="polite"></section>
    </main>
  </div>

<script>
function normalizeSite(site={}){
  return {
    name:site.name||'MASATO NASU',
    tagline:String(site.tagline||''),
    aboutIntro:String(site.aboutIntro||''),
    about:String(site.about||''),
    profileImage:String(site.profileImage||'').trim()
  };
}
function escapeHtml(value=''){
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
async function loadSiteData(){
  const candidates=['/api/data','./data.json','data.json']; let lastError=null;
  for(const url of candidates){
    try{const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('Failed to load '+url);return await res.json();}
    catch(error){lastError=error;}
  }
  throw lastError||new Error('Failed to load data');
}
function setupScratch(canvas){
  const wrap=canvas.parentElement;
  const rect=wrap.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.round(rect.width*dpr));
  canvas.height=Math.max(1,Math.round(rect.height*dpr));
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#b9b9b5';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.fillStyle='#5f5f5b';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font=`700 ${Math.max(15,Math.round(canvas.width/19))}px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;
  ctx.fillText('SCRATCH HERE',canvas.width/2,canvas.height/2);
  ctx.restore();

  let drawing=false, last=null;
  function point(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)};
  }
  function erase(a,b){
    const radius=Math.max(24,canvas.width*.065);
    ctx.save();
    ctx.globalCompositeOperation='destination-out';
    ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=radius*2;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.beginPath();ctx.arc(b.x,b.y,radius,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture?.(e.pointerId);last=point(e);erase(last,last);e.preventDefault();});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);erase(last,p);last=p;e.preventDefault();});
  const stop=e=>{drawing=false;last=null;try{canvas.releasePointerCapture?.(e.pointerId);}catch(_){}};
  canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')stop(e);});
}
async function boot(){
  const root=document.getElementById('about-root');
  try{
    const data=await loadSiteData();
    const site=normalizeSite(data.site||{});
    const portfolio=Array.isArray(data.portfolio)?data.portfolio:[];
    const memory=Array.isArray(data.memory)?data.memory:[];
    const tools=Array.isArray(data.tools)?data.tools:[];
    document.title=`${site.name} / About`;
    document.getElementById('site-title').textContent=site.name;
    document.getElementById('about-eyebrow').textContent=site.tagline;
    document.getElementById('about-lede').textContent=site.aboutIntro;

    const image=site.profileImage||'https://masato-lab.pages.dev/media/about/2026-06-13T04-02-44-750Z-image.png';
    const portrait=image?`<aside class="portrait-card"><div class="portrait-wrap"><img src="${escapeHtml(image)}" alt="Masato Nasu" loading="eager"><canvas class="scratch" id="scratchCanvas" aria-label="Scratch here to reveal portrait"></canvas></div><div class="portrait-note">SCRATCH TO REVEAL</div></aside>`:'';
    const stats=`<div class="stats"><div class="stat"><p class="stat-label">Portfolio</p><p class="stat-value">${portfolio.length}</p></div><div class="stat"><p class="stat-label">Memory</p><p class="stat-value">${memory.length}</p></div><div class="stat"><p class="stat-label">Tools</p><p class="stat-value">${tools.length}</p></div></div>`;
    const body=site.about?`<p class="about-text">${escapeHtml(site.about)}</p>`:'<p class="about-text">About 文がまだありません。</p>';
    root.innerHTML=`<div class="about-grid">${portrait}<section class="panel">${body}${stats}</section></div>`;
    const canvas=document.getElementById('scratchCanvas');
    if(canvas) requestAnimationFrame(()=>setupScratch(canvas));
  }catch(error){
    console.error(error);root.innerHTML='<section class="error-state">About の読み込みに失敗しました。データの保存状態を確認してください。</section>';
  }
}
boot();
</script>
</body>
</html>
