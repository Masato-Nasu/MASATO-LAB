<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About</title>
  <style>
    :root { --bg:#f5f5f2; --panel:#ffffff; --text:#111111; --muted:#666666; --line:#d8d8d2; --shadow:0 10px 28px rgba(0,0,0,.06); --radius:24px; --max:1180px; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); }
    body { line-height:1.7; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
    a { color:inherit; text-decoration:none; }
    .wrap { max-width:var(--max); margin:0 auto; padding:22px 20px 56px; }
    .site-header { display:grid; gap:10px; margin-bottom:18px; }
    .site-title { margin:0; font-size:clamp(32px,5vw,54px); line-height:.98; letter-spacing:-.03em; font-weight:700; }
    .nav { display:flex; gap:18px; flex-wrap:wrap; align-items:center; font-size:15px; padding-bottom:10px; }
    .nav a[aria-current="page"] { font-weight:700; }
    .page-head { margin:20px 0 18px; display:grid; gap:12px; }
    .eyebrow { display:inline-flex; align-items:center; width:fit-content; min-height:34px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:#fafaf7; color:var(--muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
    .page-title { margin:0; font-size:clamp(34px,6vw,68px); line-height:.98; letter-spacing:-.04em; font-weight:700; }
    .lede { margin:0; color:var(--muted); font-size:18px; white-space:pre-wrap; max-width:820px; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:0 0 18px; }
    .stat { background:#fafaf8; border:1px solid var(--line); border-radius:20px; padding:16px 18px; }
    .stat-label { margin:0 0 6px; color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    .stat-value { margin:0; font-size:28px; line-height:1; letter-spacing:-.03em; font-weight:700; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow); padding:28px; display:grid; gap:20px; }
    .about-text { margin:0; white-space:pre-wrap; font-size:16px; }
    .empty-state, .error-state { background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:28px; color:var(--muted); box-shadow:var(--shadow); }
    @media (max-width:720px) { .wrap { padding:18px 14px 36px; } .panel { padding:22px; } .stats { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1 class="site-title" id="site-title">MASATO NASU</h1>
      <nav class="nav" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./portfolio.html">Portfolio</a>
        <a href="./memory.html">Peripheral Memory</a>
        <a href="./tools.html">Tools</a>
        <a href="./about.html" aria-current="page">About</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <div class="eyebrow" id="about-eyebrow">Product Design · Computational Experiments · Personal Lab</div>
        <h2 class="page-title">About</h2>
        <p class="lede" id="about-lede">A compact overview of what this site is for and what kind of work is collected here.</p>
      </section>
      <div class="stats" id="about-stats"></div>
      <section id="about-root" aria-live="polite"></section>
    </main>
  </div>

  <script>

function normalizeSite(site = {}) {
  return {
    name: site.name || 'MASATO NASU',
    tagline: site.tagline || 'Product Design · Computational Experiments · Personal Lab',
    homeTitle: site.homeTitle || 'Portfolio / Peripheral Memory / Tools',
    homeIntro: site.homeIntro || String(site.about || '').split('\n').filter(Boolean)[0] || 'Product designer / computational experiments.',
    homePortfolioText: site.homePortfolioText || 'Selected works, objects, and experiments.',
    homeMemoryText: site.homeMemoryText || 'Links, notes, and records that stay at the edge of memory.',
    homeToolsText: site.homeToolsText || 'Apps, prototypes, and utilities built for actual use.',
    aboutIntro: site.aboutIntro || site.tagline || 'A compact overview of this site.',
    about: site.about || '',
    portfolioIntro: site.portfolioIntro || 'Selected works, objects, and experiments.',
    memoryIntro: site.memoryIntro || 'Links and notes that remain nearby, ready to be revisited.',
    toolsIntro: site.toolsIntro || 'Apps, prototypes, and utilities built for actual use.'
  };
}

function escapeHtml(value = '') {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normalizeTags(tags) {
  if (Array.isArray(tags)) return tags.filter(Boolean);
  if (typeof tags === 'string') return tags.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}

async function loadSiteData() {
  const candidates = ['/api/data', './data.json', 'data.json'];
  let lastError = null;
  for (const url of candidates) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Failed to load ${url}`);
      return await res.json();
    } catch (error) {
      lastError = error;
    }
  }
  throw lastError || new Error('Failed to load data');
}


    async function boot() {
      const root = document.getElementById('about-root');
      try {
        const data = await loadSiteData();
        const site = normalizeSite(data.site || {});
        const portfolio = Array.isArray(data.portfolio) ? data.portfolio : [];
        const memory = Array.isArray(data.memory) ? data.memory : [];
        const tools = Array.isArray(data.tools) ? data.tools : [];

        document.title = `${site.name} / About`;
        document.getElementById('site-title').textContent = site.name;
        document.getElementById('about-eyebrow').textContent = site.tagline;
        document.getElementById('about-lede').textContent = site.aboutIntro;
        document.getElementById('about-stats').innerHTML = `
          <div class="stat"><p class="stat-label">Portfolio</p><p class="stat-value">${portfolio.length}</p></div>
          <div class="stat"><p class="stat-label">Memory</p><p class="stat-value">${memory.length}</p></div>
          <div class="stat"><p class="stat-label">Tools</p><p class="stat-value">${tools.length}</p></div>`;

        if (!site.about) {
          root.innerHTML = '<section class="empty-state">About 文がまだありません。Editor で site.about を入力して保存してください。</section>';
          return;
        }

        root.innerHTML = `<section class="panel"><p class="about-text">${escapeHtml(site.about)}</p></section>`;
      } catch (error) {
        console.error(error);
        root.innerHTML = '<section class="error-state">About の読み込みに失敗しました。データの保存状態を確認してください。</section>';
      }
    }

    boot();
  </script>
</body>
</html>
