<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASATO NASU – Tools</title>
  <style>
    :root{--bg:#f5f5f3;--text:#111;--muted:#6b7280;--line:#d9d9d4;--card:#ffffff;--radius:24px;}
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg);}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1360px;margin:0 auto;padding:28px 20px 56px}
    .site-title{font-size:64px;line-height:.95;font-weight:800;letter-spacing:-.03em;margin:0 0 18px;}
    .nav{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 26px}
    .nav a{font-size:18px}
    .nav a.active{font-weight:700}
    .eyebrow{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fafaf7;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;}
    .page-title{font-size:72px;line-height:.95;font-weight:800;letter-spacing:-.04em;margin:18px 0 14px;}
    .page-intro{margin:0 0 26px;color:var(--muted);font-size:18px;max-width:860px;white-space:pre-wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.02);}
    .media{position:relative;width:100%;background:#efefec;border-bottom:1px solid var(--line);overflow:hidden;}
    .media[data-ratio="1:1"]{aspect-ratio:1/1;}
    .media[data-ratio="4:3"]{aspect-ratio:4/3;}
    .media[data-ratio="3:4"]{aspect-ratio:3/4;}
    .media[data-ratio="2:3"]{aspect-ratio:2/3;}
    .media[data-ratio="16:9"]{aspect-ratio:16/9;}
    .media:not([data-ratio]){aspect-ratio:4/3;}
    .media-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);filter:blur(18px) saturate(1.04);opacity:.85;}
    .media-overlay{position:absolute;inset:0;background:rgba(255,255,255,.08);pointer-events:none;}
    .media-fg-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;}
    .media-fg{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;position:relative;z-index:2;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.08);background:transparent;}
    .content{padding:18px 18px 20px}
    .tool-title{font-size:22px;line-height:1.15;font-weight:800;margin:0 0 10px;letter-spacing:-.02em;}
    .desc{font-size:14px;line-height:1.8;color:#222;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;margin:0 0 12px;}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
    .tag{font-size:12px;line-height:1;padding:8px 10px;border-radius:999px;border:1px solid var(--line);color:#444;background:#fafaf8;}
    .links{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;}
    .empty{color:var(--muted);font-size:15px;border:1px dashed var(--line);border-radius:20px;padding:20px;}
    .section-toc{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;margin:0 0 26px;box-shadow:0 8px 20px rgba(0,0,0,.04);backdrop-filter:blur(8px);}
    .section-toc-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
    .section-toc-title{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
    .section-toc-top{font-size:13px;color:var(--muted)}
    .section-toc-list{display:flex;flex-wrap:wrap;gap:10px}
    .section-toc-link{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;line-height:1.2;}
    .card-jump{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;}
    @media (max-width:640px){.wrap{padding:18px 12px 40px}.site-title{font-size:40px}.page-title{font-size:56px;margin:10px 0 14px}.nav{gap:14px;margin-bottom:18px}.nav a{font-size:15px}.content{padding:16px}.tool-title{font-size:18px}}
  </style>
</head>
<body>
  <div class="wrap" id="top">
    <h1 class="site-title" id="site-title">MASATO NASU</h1>
    <nav class="nav" aria-label="Main navigation">
      <a href="./">Home</a>
      <a href="./portfolio.html">Portfolio</a>
      <a href="./memory.html">Peripheral Memory</a>
      <a href="./tools.html" class="active">Tools</a>
      <a href="./about.html">About</a>
    </nav>

    <div class="eyebrow" id="tools-eyebrow">Product Design · Computational Experiments · Personal Lab</div>
    <h2 class="page-title">Tools</h2>
    <p class="page-intro" id="tools-intro">Apps, prototypes, and utilities built for actual use.</p>

    <section id="toolsToc" class="section-toc" hidden aria-label="Tools 目次">
      <div class="section-toc-head">
        <h3 class="section-toc-title">Contents</h3>
        <a class="section-toc-top" href="#top">Top</a>
      </div>
      <div id="toolsTocList" class="section-toc-list"></div>
    </section>

    <div id="toolsGrid" class="grid"></div>
  </div>

  <script>

function normalizeSite(site = {}) {
  return {
    name: site.name || 'MASATO NASU',
    tagline: site.tagline || 'Product Design · Computational Experiments · Personal Lab',
    homeTitle: site.homeTitle || 'Portfolio / Peripheral Memory / Tools',
    homeIntro: site.homeIntro || String(site.about || '').split('\n').filter(Boolean)[0] || 'Product designer / computational experiments.',
    homePortfolioText: site.homePortfolioText || 'Selected works, objects, and experiments.',
    homeMemoryText: site.homeMemoryText || 'Links, notes, and records that stay at the edge of memory.',
    homeToolsText: site.homeToolsText || 'Apps, prototypes, and utilities built for actual use.',
    aboutIntro: site.aboutIntro || site.tagline || 'A compact overview of this site.',
    about: site.about || '',
    portfolioIntro: site.portfolioIntro || 'Selected works, objects, and experiments.',
    memoryIntro: site.memoryIntro || 'Links and notes that remain nearby, ready to be revisited.',
    toolsIntro: site.toolsIntro || 'Apps, prototypes, and utilities built for actual use.'
  };
}

function escapeHtml(value = '') {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function normalizeTags(tags) {
  if (Array.isArray(tags)) return tags.filter(Boolean);
  if (typeof tags === 'string') return tags.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}

async function loadSiteData() {
  const candidates = ['/api/data', './data.json', 'data.json'];
  let lastError = null;
  for (const url of candidates) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`Failed to load ${url}`);
      return await res.json();
    } catch (error) {
      lastError = error;
    }
  }
  throw lastError || new Error('Failed to load data');
}


    const toolsToc = document.getElementById('toolsToc');
    const toolsTocList = document.getElementById('toolsTocList');

    function ratioOf(tool) {
      return tool.imageRatio || '4:3';
    }

    function slugify(value='') {
      const base = String(value || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9぀-ヿ㐀-鿿]+/g,'-').replace(/^-+|-+$/g,'');
      return base || 'item';
    }

    function uniqueIds(items, keyName) {
      const used = new Map();
      return items.map((item, index) => {
        const raw = item?.[keyName] || `item-${index + 1}`;
        const base = slugify(raw);
        const count = used.get(base) || 0;
        used.set(base, count + 1);
        return count ? `${base}-${count + 1}` : base;
      });
    }

    function buildToc(items, ids) {
      if (!items.length) {
        toolsToc.hidden = true;
        toolsTocList.innerHTML = '';
        return;
      }
      toolsToc.hidden = false;
      toolsTocList.innerHTML = items.map((item, index) => `<a class="section-toc-link" href="#${ids[index]}">${escapeHtml(item.title || `Item ${index + 1}`)}</a>`).join('');
    }

    function toolCard(tool, anchorId) {
      const title = escapeHtml(tool.title || '');
      const desc = escapeHtml(tool.description || '');
      const tags = normalizeTags(tool.tags);
      const image = tool.image || '';
      const ratio = ratioOf(tool);
      const media = image ? `
        <div class="media" data-ratio="${escapeHtml(ratio)}">
          <img class="media-bg" src="${escapeHtml(image)}" alt="" loading="lazy" aria-hidden="true">
          <div class="media-overlay"></div>
          <div class="media-fg-wrap"><img class="media-fg" src="${escapeHtml(image)}" alt="${title}" loading="lazy"></div>
        </div>` : '';
      const tagHtml = tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('');
      const appLink = tool.appUrl ? `<a class="btn" href="${escapeHtml(tool.appUrl)}" target="_blank" rel="noopener noreferrer">Open app</a>` : '';
      const repoLink = tool.repoUrl ? `<a class="btn" href="${escapeHtml(tool.repoUrl)}" target="_blank" rel="noopener noreferrer">GitHub</a>` : '';
      return `
        <article id="${anchorId}" class="card">
          ${media}
          <div class="content">
            <h3 class="tool-title">${title}</h3>
            ${desc ? `<p class="desc">${desc}</p>` : ''}
            ${tagHtml ? `<div class="meta">${tagHtml}</div>` : ''}
            <div class="links">
              ${appLink}
              ${repoLink}
              <a class="card-jump" href="#top">↑ Contents</a>
            </div>
          </div>
        </article>`;
    }

    async function main() {
      const grid = document.getElementById('toolsGrid');
      try {
        const data = await loadSiteData();
        const site = normalizeSite(data.site || {});
        document.getElementById('site-title').textContent = site.name;
        document.getElementById('tools-eyebrow').textContent = site.tagline;
        document.getElementById('tools-intro').textContent = site.toolsIntro;
        document.title = `${site.name} / Tools`;

        const items = Array.isArray(data.tools) ? data.tools : [];
        if (!items.length) {
          toolsToc.hidden = true;
          grid.innerHTML = `<div class="empty">まだ Tools 項目がありません。</div>`;
          return;
        }
        const ids = uniqueIds(items, 'title');
        buildToc(items, ids);
        grid.innerHTML = items.map((tool, index) => toolCard(tool, ids[index])).join('');
      } catch (error) {
        console.error(error);
        toolsToc.hidden = true;
        grid.innerHTML = `<div class="empty">Tools の読み込みに失敗しました。/api/data または data.json を確認してください。</div>`;
      }
    }

    main();
  </script>
</body>
</html>
