<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASATO NASU – Tools</title>
  <style>
    :root{--bg:#f5f5f3;--text:#111;--muted:#6b7280;--line:#d9d9d4;--card:#fff;--soft:#fafaf7}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg)}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    .wrap{max-width:1360px;margin:0 auto;padding:28px 20px 64px}
    .site-title{font-size:64px;line-height:.95;font-weight:800;letter-spacing:-.03em;margin:0 0 18px}
    .nav{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 28px}
    .nav a{font-size:18px}.nav a.active{font-weight:700}
    .eyebrow{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fafaf7;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
    .page-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:24px;margin:18px 0 26px}
    .page-title{font-size:72px;line-height:.95;font-weight:800;letter-spacing:-.04em;margin:0 0 14px}
    .page-intro{margin:0;color:var(--muted);font-size:18px;max-width:760px;white-space:pre-wrap}
    .project-count{font-size:14px;color:var(--muted);white-space:nowrap;padding-bottom:4px}

    .toolbar{display:grid;grid-template-columns:minmax(220px,420px) minmax(0,1fr);gap:14px;align-items:center;padding:14px;margin:0 0 13px;background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.035);backdrop-filter:blur(10px)}
    .search-wrap{position:relative}
    .search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--text);outline:none;padding:0 44px 0 15px;transition:border-color .18s ease,box-shadow .18s ease}
    .search:focus{border-color:#999;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
    .search-clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1}
    .search-clear:hover{background:#f1f1ee;color:var(--text)}
    .filters{display:flex;justify-content:flex-end;gap:8px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
    .filter{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#333;cursor:pointer;font-size:13px;font-weight:650;letter-spacing:.01em}
    .filter:hover{border-color:#aaa}.filter.active{background:#111;color:#fff;border-color:#111}
    .status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
    .result-count{font-size:13px;color:var(--muted)}
    .reset{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}.reset[hidden]{display:none}

    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.02);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
    .card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.065);border-color:#c7c7c1}
    .media{position:relative;width:100%;aspect-ratio:16/10;background:#efefec;border-bottom:1px solid var(--line);overflow:hidden}
    .media-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);filter:blur(18px) saturate(1.03);opacity:.76}
    .media-overlay{position:absolute;inset:0;background:rgba(255,255,255,.11);pointer-events:none}
    .media-fg-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
    .media-fg{max-width:100%;max-height:100%;width:auto;height:auto;display:block;position:relative;z-index:2;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
    .media-placeholder{display:flex;align-items:flex-end;width:100%;aspect-ratio:16/10;padding:16px;background:linear-gradient(145deg,#ecece8,#f8f8f5);border-bottom:1px solid var(--line);color:#9a9a94;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .content{padding:15px 15px 16px}
    .tool-title{font-size:18px;line-height:1.2;font-weight:800;margin:0 0 8px;letter-spacing:-.018em;overflow-wrap:anywhere}
    .desc{font-size:13px;line-height:1.6;color:#333;margin:0 0 12px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;min-height:62px}
    .meta{display:flex;align-items:center;gap:6px;min-height:26px;margin:0 0 13px;overflow:hidden}
    .tag{flex:0 1 auto;max-width:106px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;line-height:1;padding:7px 8px;border-radius:999px;border:1px solid var(--line);color:#555;background:var(--soft)}
    .tag.more{flex:0 0 auto;color:var(--muted)}
    .links{display:flex;align-items:center;gap:8px;min-height:36px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:650;transition:background .16s ease,border-color .16s ease}
    .btn:hover{border-color:#aaa}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.primary:hover{background:#292929}
    .empty{grid-column:1/-1;color:var(--muted);font-size:15px;border:1px dashed var(--line);border-radius:20px;padding:28px;text-align:center;background:rgba(255,255,255,.48)}

    @media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:820px){.page-head{grid-template-columns:1fr;gap:8px}.project-count{padding:0}.toolbar{grid-template-columns:1fr}.filters{justify-content:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.wrap{padding:18px 12px 44px}.site-title{font-size:40px}.page-title{font-size:54px}.nav{gap:14px;margin-bottom:20px}.nav a{font-size:15px}.eyebrow{font-size:10px}.page-intro{font-size:15px;line-height:1.65}.page-head{margin:12px 0 20px}.toolbar{padding:10px;border-radius:18px}.grid{grid-template-columns:1fr;gap:13px}.card{display:grid;grid-template-columns:124px minmax(0,1fr);border-radius:18px}.media,.media-placeholder{height:100%;min-height:176px;aspect-ratio:auto;border-bottom:0;border-right:1px solid var(--line)}.media-fg-wrap{padding:8px}.content{padding:13px}.tool-title{font-size:17px}.desc{font-size:12px;line-height:1.55;min-height:auto;-webkit-line-clamp:3}.meta{margin-bottom:10px}.tag{max-width:86px}.btn{min-height:34px;padding:0 10px;font-size:11px}}
    @media(max-width:390px){.card{grid-template-columns:106px minmax(0,1fr)}.media,.media-placeholder{min-height:170px}.tag:nth-child(3){display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="site-title" id="site-title">MASATO NASU</h1>
    <nav class="nav" aria-label="Main navigation">
      <a href="./">Home</a>
      <a href="./portfolio.html">Portfolio</a>
      <a href="./memory.html">Peripheral Memory</a>
      <a href="./tools.html" class="active">Tools</a>
      <a href="./about.html">About</a>
    </nav>

    <div class="eyebrow" id="tools-eyebrow">Product Design · Computational Experiments · Personal Lab</div>
    <div class="page-head">
      <div>
        <h2 class="page-title">Tools</h2>
        <p class="page-intro" id="tools-intro">Apps, prototypes, and utilities built for actual use.</p>
      </div>
      <div class="project-count" id="projectCount"></div>
    </div>

    <section class="toolbar" aria-label="Tools search and filters">
      <div class="search-wrap">
        <input id="searchInput" class="search" type="search" placeholder="Search tools…" autocomplete="off" aria-label="Search tools">
        <button id="clearSearch" class="search-clear" type="button" aria-label="Clear search" title="Clear">×</button>
      </div>
      <div class="filters" role="group" aria-label="Filter tools">
        <button class="filter active" type="button" data-filter="all">ALL</button>
        <button class="filter" type="button" data-filter="ai">AI</button>
        <button class="filter" type="button" data-filter="android">ANDROID</button>
        <button class="filter" type="button" data-filter="web">WEB / PWA</button>
      </div>
    </section>

    <div class="status-row">
      <div class="result-count" id="resultCount"></div>
      <button id="resetBtn" class="reset" type="button" hidden>Reset search</button>
    </div>

    <div id="toolsGrid" class="grid"></div>
  </div>

  <script>
    function normalizeSite(site={}){
      return{
        name:site.name||'MASATO NASU',
        tagline:site.tagline||'Product Design · Computational Experiments · Personal Lab',
        toolsIntro:site.toolsIntro||'Apps, prototypes, and utilities built for actual use.'
      };
    }

    function escapeHtml(value=''){
      return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function normalizeTags(tags){
      if(Array.isArray(tags)) return tags.filter(Boolean).map(String);
      if(typeof tags==='string') return tags.split(',').map(s=>s.trim()).filter(Boolean);
      return [];
    }

    async function loadSiteData(){
      const candidates=['/api/data','./data.json','data.json'];
      let lastError=null;
      for(const url of candidates){
        try{
          const res=await fetch(url,{cache:'no-store'});
          if(!res.ok) throw new Error(`Failed to load ${url}`);
          return await res.json();
        }catch(error){lastError=error;}
      }
      throw lastError||new Error('Failed to load data');
    }

    function searchableText(tool){
      return [tool.title,tool.description,...normalizeTags(tool.tags),tool.appUrl,tool.repoUrl].filter(Boolean).join(' ').toLowerCase();
    }

    function filterMatch(tool,filter){
      if(filter==='all') return true;
      const text=searchableText(tool);
      if(filter==='ai') return /(\bai\b|artificial intelligence|gpt|openai|claude|gemini|whisper|llm|language model|生成ai|人工知能|音声認識|翻訳)/i.test(text);
      if(filter==='android') return /(android|apk|google play|play store)/i.test(text);
      if(filter==='web') return /(\bpwa\b|web app|website|browser|cloudflare|pages\.dev|workers\.dev|github\.io|javascript|html|css)/i.test(text)||/^https?:\/\//i.test(tool.appUrl||'');
      return true;
    }

    function mediaHtml(tool,title){
      const image=tool.image||'';
      if(!image) return '<div class="media-placeholder">MASATO LAB</div>';
      const fit=tool.imageFit==='cover'?'cover':'contain';
      return `<div class="media">
        <img class="media-bg" src="${escapeHtml(image)}" alt="" loading="lazy" aria-hidden="true">
        <div class="media-overlay"></div>
        <div class="media-fg-wrap"><img class="media-fg" style="object-fit:${fit}" src="${escapeHtml(image)}" alt="${title}" loading="lazy"></div>
      </div>`;
    }

    function toolCard(tool){
      const title=escapeHtml(tool.title||'Untitled');
      const desc=escapeHtml(tool.description||'');
      const tags=normalizeTags(tool.tags);
      const shownTags=tags.slice(0,3);
      const extra=Math.max(0,tags.length-shownTags.length);
      const tagHtml=shownTags.map(tag=>`<span class="tag">#${escapeHtml(tag)}</span>`).join('')+(extra?`<span class="tag more">+${extra}</span>`:'');
      const appLink=tool.appUrl?`<a class="btn primary" href="${escapeHtml(tool.appUrl)}" target="_blank" rel="noopener noreferrer">OPEN</a>`:'';
      const repoLink=tool.repoUrl?`<a class="btn" href="${escapeHtml(tool.repoUrl)}" target="_blank" rel="noopener noreferrer">GITHUB</a>`:'';
      return `<article class="card">
        ${mediaHtml(tool,title)}
        <div class="content">
          <h3 class="tool-title">${title}</h3>
          ${desc?`<p class="desc">${desc}</p>`:'<p class="desc"></p>'}
          <div class="meta">${tagHtml}</div>
          <div class="links">${appLink}${repoLink}</div>
        </div>
      </article>`;
    }

    const state={items:[],filter:'all',query:''};
    const grid=document.getElementById('toolsGrid');
    const searchInput=document.getElementById('searchInput');
    const clearSearch=document.getElementById('clearSearch');
    const resetBtn=document.getElementById('resetBtn');
    const resultCount=document.getElementById('resultCount');
    const projectCount=document.getElementById('projectCount');
    const filterButtons=[...document.querySelectorAll('.filter')];

    function render(){
      const query=state.query.trim().toLowerCase();
      const visible=state.items.filter(tool=>filterMatch(tool,state.filter)&&(!query||searchableText(tool).includes(query)));
      grid.innerHTML=visible.length?visible.map(toolCard).join(''):'<div class="empty">該当するToolがありません。検索語またはフィルターを変更してください。</div>';
      resultCount.textContent=`${visible.length} / ${state.items.length} tools`;
      projectCount.textContent=`${state.items.length} PROJECTS`;
      resetBtn.hidden=state.filter==='all'&&!query;
    }

    function reset(){
      state.filter='all';state.query='';searchInput.value='';
      filterButtons.forEach(btn=>btn.classList.toggle('active',btn.dataset.filter==='all'));
      render();
    }

    searchInput.addEventListener('input',()=>{state.query=searchInput.value;render();});
    clearSearch.addEventListener('click',()=>{state.query='';searchInput.value='';searchInput.focus();render();});
    resetBtn.addEventListener('click',reset);
    filterButtons.forEach(btn=>btn.addEventListener('click',()=>{
      state.filter=btn.dataset.filter||'all';
      filterButtons.forEach(b=>b.classList.toggle('active',b===btn));
      render();
    }));

    async function main(){
      try{
        const data=await loadSiteData();
        const site=normalizeSite(data.site||{});
        document.getElementById('site-title').textContent=site.name;
        document.getElementById('tools-eyebrow').textContent=site.tagline;
        document.getElementById('tools-intro').textContent=site.toolsIntro;
        document.title=`${site.name} / Tools`;
        state.items=Array.isArray(data.tools)?data.tools:[];
        render();
      }catch(error){
        console.error(error);
        grid.innerHTML='<div class="empty">Tools の読み込みに失敗しました。/api/data または data.json を確認してください。</div>';
        resultCount.textContent='';projectCount.textContent='';
      }
    }

    main();
  </script>
</body>
</html>
