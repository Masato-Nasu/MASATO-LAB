<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peripheral Memory</title>
  <style>
    :root{--bg:#f5f5f2;--panel:#fff;--text:#111;--muted:#666;--line:#d8d8d2;--shadow:0 6px 20px rgba(0,0,0,.04);--max:1180px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}body{line-height:1.6;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.wrap{max-width:var(--max);margin:0 auto;padding:22px 20px 56px}.site-header{display:grid;gap:10px;margin-bottom:18px}.site-title{margin:0;font-size:clamp(32px,5vw,54px);line-height:.98;letter-spacing:-.03em;font-weight:700}.nav{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:15px;padding-bottom:10px}.nav a[aria-current="page"]{font-weight:700}.page-head{margin:20px 0 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}.eyebrow{display:inline-flex;align-items:center;width:fit-content;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fafaf7;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}.page-title{margin:0 0 10px;font-size:clamp(34px,6vw,68px);line-height:.98;letter-spacing:-.04em;font-weight:700}.page-intro{margin:0;color:var(--muted);font-size:18px;max-width:820px;white-space:pre-wrap}.count{font-size:13px;color:var(--muted)}.memories{display:grid;gap:20px}.memory-card{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:minmax(250px,38%) minmax(0,1fr)}.memory-media{position:relative;background:#ecece8;border-right:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:260px}.memory-media[data-ratio="1:1"]{aspect-ratio:1/1}.memory-media[data-ratio="4:3"]{aspect-ratio:4/3}.memory-media[data-ratio="3:4"]{aspect-ratio:3/4}.memory-media[data-ratio="2:3"]{aspect-ratio:2/3}.memory-media[data-ratio="16:9"]{aspect-ratio:16/9}.memory-media img{width:100%;height:100%;display:block;transform-origin:center center}.memory-content{padding:20px;display:flex;flex-direction:column;gap:10px}.memory-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.memory-title{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.08;letter-spacing:-.02em}.memory-meta{flex:0 0 auto;color:var(--muted);font-size:13px}.memory-comment{margin:0;font-size:15px;line-height:1.75;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3}.tags{display:flex;gap:7px;overflow:hidden}.tag{max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fafaf7;color:var(--muted);font-size:11px}.actions{margin-top:auto;padding-top:4px}.read-more{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border-radius:999px;background:#111;color:#fff;border:1px solid #111;font-size:12px;font-weight:700;letter-spacing:.04em}.memory-card.no-image{display:block}.memory-card.no-image .memory-content{padding:22px}.empty-state,.error-state{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;color:var(--muted);box-shadow:var(--shadow)}
    @media(max-width:760px){.wrap{padding:18px 14px 36px}.page-head{grid-template-columns:1fr}.memory-card{grid-template-columns:1fr}.memory-media{border-right:0;border-bottom:1px solid var(--line);min-height:230px}.memory-content{padding:17px}.memory-head{flex-direction:column;gap:6px}.memory-meta{align-self:flex-start}.page-intro{font-size:15px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="site-header"><h1 class="site-title" id="site-title">MASATO NASU</h1><nav class="nav" aria-label="Main navigation"><a href="./index.html">Home</a><a href="./portfolio.html">Portfolio</a><a href="./memory.html" aria-current="page">Peripheral Memory</a><a href="./tools.html">Tools</a><a href="./about.html">About</a></nav></header>
  <main><section class="page-head"><div><div class="eyebrow" id="memory-eyebrow">Product Design · Computational Experiments · Personal Lab</div><h2 class="page-title">Peripheral Memory</h2><p class="page-intro" id="memory-intro">Links and notes that remain nearby, ready to be revisited.</p></div><div class="count" id="memory-count"></div></section><section id="memory-root" class="memories" aria-live="polite"></section></main>
</div>
<script>
function normalizeSite(site={}){return{name:site.name||'MASATO NASU',tagline:site.tagline||'Product Design · Computational Experiments · Personal Lab',memoryIntro:site.memoryIntro||'Links and notes that remain nearby, ready to be revisited.'};}
function escapeHtml(value=''){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function normalizeTags(tags){if(Array.isArray(tags))return tags.filter(Boolean);if(typeof tags==='string')return tags.split(',').map(s=>s.trim()).filter(Boolean);return[];}
async function loadSiteData(){const candidates=['/api/data','./data.json','data.json'];let lastError=null;for(const url of candidates){try{const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('Failed to load '+url);return await res.json();}catch(error){lastError=error;}}throw lastError||new Error('Failed to load data');}
function slugify(value=''){return String(value||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g,'-').replace(/^-+|-+$/g,'')||'item';}
function buildSlugs(items){const used=new Map();return items.map((item,index)=>{const raw=item.slug||item.title||`memory-${index+1}`;const base=slugify(raw);const count=used.get(base)||0;used.set(base,count+1);return count?`${base}-${count+1}`:base;});}
function ratioOf(item){const r=String(item.imageRatio||'').trim();return['1:1','4:3','3:4','2:3','16:9'].includes(r)?r:'4:3';}
function clampNumber(value,fallback,min,max){const n=Number(value);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):fallback;}
function memoryCard(item,slug){const title=escapeHtml(item.title||'Untitled');const comment=escapeHtml(item.comment||'');const date=escapeHtml(item.date||'');const image=String(item.image||'').trim();const ratio=ratioOf(item);const fit=item.imageFit==='cover'?'cover':'contain';const scale=clampNumber(item.listImageScale,100,60,140)/100;const x=clampNumber(item.listImageX,0,-25,25);const y=clampNumber(item.listImageY,0,-25,25);const tags=normalizeTags(item.tags);const shown=tags.slice(0,3);const extra=Math.max(0,tags.length-shown.length);const tagsHtml=shown.length||extra?`<div class="tags">${shown.map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join('')}${extra?`<span class="tag">+${extra}</span>`:''}</div>`:'';const media=image?`<div class="memory-media" data-ratio="${escapeHtml(ratio)}"><img src="${escapeHtml(image)}" alt="${title}" loading="lazy" style="object-fit:${fit};transform:translate(${x}%,${y}%) scale(${scale})"></div>`:'';const detail=`/memory/${encodeURIComponent(slug)}`;return`<article class="memory-card${image?'':' no-image'}">${media}<div class="memory-content"><div class="memory-head"><h3 class="memory-title">${title}</h3>${date?`<div class="memory-meta">${date}</div>`:''}</div>${comment?`<p class="memory-comment">${comment}</p>`:''}${tagsHtml}<div class="actions"><a class="read-more" href="${detail}">READ MORE</a></div></div></article>`;}
async function boot(){const root=document.getElementById('memory-root');try{const data=await loadSiteData();const site=normalizeSite(data.site||{});document.getElementById('site-title').textContent=site.name;document.getElementById('memory-eyebrow').textContent=site.tagline;document.getElementById('memory-intro').textContent=site.memoryIntro;document.title=`${site.name} / Peripheral Memory`;const memories=Array.isArray(data.memory)?data.memory:[];document.getElementById('memory-count').textContent=`${memories.length} ENTRIES`;if(!memories.length){root.innerHTML='<section class="empty-state">まだ Peripheral Memory 項目がありません。</section>';return;}const slugs=buildSlugs(memories);root.innerHTML=memories.map((item,index)=>memoryCard(item,slugs[index])).join('');}catch(error){console.error(error);root.innerHTML='<section class="error-state">Peripheral Memory の読み込みに失敗しました。</section>';}}
boot();
</script>
</body>
</html>
