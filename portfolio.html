<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --panel: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #d8d8d2;
      --shadow: 0 10px 28px rgba(0,0,0,.06);
      --radius: 28px;
      --max: 1180px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }
    body {
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    img {
      display: block;
      max-width: 100%;
    }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 22px 20px 56px;
    }

    .site-header {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .site-title {
      margin: 0;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 15px;
      padding-bottom: 10px;
    }
    .nav a[aria-current="page"] {
      font-weight: 700;
    }

    .page-head {
      margin: 20px 0 24px;
    }
    .page-title {
      margin: 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 0.98;
      letter-spacing: -0.04em;
      font-weight: 700;
    }

    .works {
      display: grid;
      gap: 28px;
    }

    .work-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .work-media {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid var(--line);
      background: #ecece6;
      isolation: isolate;
    }
    .work-media.ratio-43 { aspect-ratio: 4 / 3; }
    .work-media.ratio-11 { aspect-ratio: 1 / 1; }
    .work-media.ratio-34 { aspect-ratio: 3 / 4; }
    .work-media.ratio-23 { aspect-ratio: 2 / 3; }

    .work-media.empty {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .04em;
      min-height: 320px;
    }

    .work-media .main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      position: relative;
      z-index: 2;
    }

    .work-media.portrait {
      display: grid;
      place-items: center;
    }
    .work-media.portrait .color-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.16);
      filter: blur(22px) saturate(1.1);
      opacity: 0.96;
      z-index: 0;
    }
    .work-media.portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.12));
      z-index: 1;
      pointer-events: none;
    }
    .work-media.portrait .main-image {
      width: auto;
      height: 100%;
      max-width: none;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      box-shadow: 0 10px 26px rgba(0,0,0,.12);
    }

    .work-body {
      padding: 20px 22px 22px;
      display: grid;
      gap: 12px;
    }

    .work-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
      flex-wrap: wrap;
    }
    .work-title {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.08;
      letter-spacing: -.02em;
    }
    .work-meta {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
      padding-top: 4px;
    }
    .work-role {
      font-size: 15px;
      color: var(--text);
      opacity: .82;
    }
    .work-desc {
      margin: 0;
      white-space: pre-wrap;
      color: #222;
      font-size: 15px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fafaf7;
      color: var(--muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #111;
      color: #fff;
      font-size: 14px;
    }

    .empty-state,
    .error-state {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 28px;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    @media (max-width: 720px) {
      .wrap {
        padding: 18px 14px 36px;
      }
      .work-body {
        padding: 16px;
      }
      .work-media.empty {
        min-height: 240px;
      }
      .work-meta {
        white-space: normal;
      }
      .work-media.portrait .color-fill {
        transform: scale(1.22);
        filter: blur(18px) saturate(1.08);
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1 class="site-title" id="site-title">MASATO NASU</h1>
      <nav class="nav" aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./portfolio.html" aria-current="page">Portfolio</a>
        <a href="./memory.html">Peripheral Memory</a>
        <a href="./tools.html">Tools</a>
        <a href="./about.html">About</a>
      </nav>
    </header>

    <main>
      <section class="page-head">
        <h2 class="page-title">Portfolio</h2>
      </section>
      <section id="portfolio-root" class="works" aria-live="polite"></section>
    </main>
  </div>

  <script>
    const root = document.getElementById('portfolio-root');
    const dataEndpoints = ['./api/data', '/api/data', './data.json'];

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeTags(tags) {
      if (Array.isArray(tags)) return tags.filter(Boolean);
      if (typeof tags === 'string') return tags.split(',').map(s => s.trim()).filter(Boolean);
      return [];
    }

    function resolveImagePath(path) {
      if (!path) return '';
      if (/^(https?:|data:|blob:)/i.test(path)) return path;
      if (path.startsWith('./') || path.startsWith('../') || path.startsWith('/')) return path;
      if (path.startsWith('images/')) return './' + path;
      return './images/' + path.replace(/^\.\//, '');
    }

    function ratioInfo(value) {
      const normalized = String(value || '4:3').trim();
      switch (normalized) {
        case '1:1': return { cls: 'ratio-11', portrait: false };
        case '3:4': return { cls: 'ratio-34', portrait: true };
        case '2:3': return { cls: 'ratio-23', portrait: true };
        default: return { cls: 'ratio-43', portrait: false };
      }
    }

    function mediaMarkup(item, title) {
      const image = resolveImagePath(item.image || '');
      const ratio = ratioInfo(item.imageRatio);

      if (!image) {
        return `<div class="work-media ${ratio.cls} empty">IMAGE</div>`;
      }

      if (ratio.portrait) {
        return `
          <div class="work-media ${ratio.cls} portrait">
            <img class="color-fill" src="${escapeHtml(image)}" alt="" aria-hidden="true" loading="lazy" decoding="async">
            <img class="main-image" src="${escapeHtml(image)}" alt="${title}" loading="lazy" decoding="async">
          </div>
        `;
      }

      return `
        <div class="work-media ${ratio.cls}">
          <img class="main-image" src="${escapeHtml(image)}" alt="${title}" loading="lazy" decoding="async">
        </div>
      `;
    }

    function workCard(item) {
      const title = escapeHtml(item.title || 'Untitled');
      const year = escapeHtml(item.year || '');
      const role = escapeHtml(item.role || '');
      const description = escapeHtml(item.description || '');
      const link = item.link ? String(item.link) : '';
      const tags = normalizeTags(item.tags);
      const media = mediaMarkup(item, title);
      const tagHtml = tags.length
        ? `<div class="tags">${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}</div>`
        : '';
      const actionHtml = link
        ? `<div class="actions"><a class="btn" href="${escapeHtml(link)}" target="_blank" rel="noreferrer">Open Link</a></div>`
        : '';

      return `
        <article class="work-card">
          ${media}
          <div class="work-body">
            <div class="work-head">
              <div>
                <h2 class="work-title">${title}</h2>
                ${role ? `<div class="work-role">${role}</div>` : ''}
              </div>
              ${year ? `<div class="work-meta">${year}</div>` : ''}
            </div>
            ${description ? `<p class="work-desc">${description}</p>` : ''}
            ${tagHtml}
            ${actionHtml}
          </div>
        </article>
      `;
    }

    async function fetchData() {
      let lastError = null;
      for (const url of dataEndpoints) {
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) throw new Error(`Failed to load ${url}`);
          return await response.json();
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('Failed to load site data');
    }

    async function boot() {
      try {
        const data = await fetchData();
        if (data?.site?.name) document.getElementById('site-title').textContent = data.site.name;
        const works = Array.isArray(data.portfolio) ? data.portfolio : [];

        if (!works.length) {
          root.innerHTML = '<section class="empty-state">まだポートフォリオ項目がありません。</section>';
          return;
        }

        root.innerHTML = works.map(workCard).join('');
      } catch (error) {
        console.error(error);
        root.innerHTML = '<section class="error-state">ポートフォリオの読み込みに失敗しました。KV または data.json の内容を確認してください。</section>';
      }
    }

    boot();
  </script>
</body>
</html>
