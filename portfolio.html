<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASATO NASU – Portfolio</title>
  <style>
    :root{--bg:#f5f5f3;--text:#111;--muted:#6b7280;--line:#d9d9d4;--card:#fff;--soft:#fafaf8}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:1360px;margin:0 auto;padding:28px 20px 64px}
    .site-title{font-size:64px;line-height:.95;font-weight:800;letter-spacing:-.03em;margin:0 0 18px}
    .nav{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 28px}.nav a{font-size:18px}.nav a.active{font-weight:700}
    .eyebrow{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fafaf7;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
    .page-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:20px;margin:18px 0 28px}.page-title{font-size:72px;line-height:.95;font-weight:800;letter-spacing:-.04em;margin:0 0 14px}.page-intro{margin:0;color:var(--muted);font-size:18px;max-width:860px;white-space:pre-wrap}.count{font-size:13px;color:var(--muted);padding-bottom:4px}
    .works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.work-card{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.02)}
    .media{position:relative;width:100%;background:#f0f0ed;border-bottom:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:10px;min-height:360px}.media[data-ratio="1:1"]{aspect-ratio:1/1}.media[data-ratio="4:3"]{aspect-ratio:4/3}.media[data-ratio="3:4"]{aspect-ratio:3/4}.media[data-ratio="2:3"]{aspect-ratio:2/3}.media[data-ratio="16:9"]{aspect-ratio:16/9}.media img{max-width:100%;max-height:100%;width:auto;height:auto;display:block;border-radius:12px}
    .content{padding:20px 20px 22px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px}.title{font-size:28px;line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:0}.role{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.45}.year{flex:0 0 auto;font-size:13px;color:var(--muted);border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:7px 11px}.desc{font-size:16px;line-height:1.75;color:#222;margin:0 0 13px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;white-space:normal;word-break:break-word}.tags{display:flex;gap:7px;overflow:hidden;margin:0 0 14px}.tag{flex:0 1 auto;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:#555}.tag.more{flex:0 0 auto;color:var(--muted)}
    .actions{display:flex;gap:9px;flex-wrap:wrap}.read-more{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border-radius:999px;background:#111;color:#fff;border:1px solid #111;font-size:12px;font-weight:750;letter-spacing:.04em}.read-more:hover{background:#2a2a2a}.empty,.error{grid-column:1/-1;color:var(--muted);font-size:15px;border:1px dashed var(--line);border-radius:20px;padding:26px;background:#fff;text-align:center}
    @media(max-width:860px){.works{grid-template-columns:1fr}.page-head{grid-template-columns:1fr}.media{min-height:320px}}
    @media(max-width:640px){.wrap{padding:18px 12px 44px}.site-title{font-size:40px}.nav{gap:14px;margin-bottom:20px}.nav a{font-size:15px}.page-title{font-size:54px}.page-intro{font-size:15px;line-height:1.65}.page-head{margin:12px 0 22px}.work-card{border-radius:20px}.media{min-height:250px;padding:8px}.content{padding:17px}.title{font-size:23px}.desc{font-size:14px;line-height:1.7}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="site-title" id="site-title">MASATO NASU</h1>
    <nav class="nav" aria-label="Main navigation">
      <a href="./">Home</a><a href="./portfolio.html" class="active">Portfolio</a><a href="./memory.html">Peripheral Memory</a><a href="./tools.html">Tools</a><a href="./about.html">About</a>
    </nav>
    <div class="eyebrow" id="portfolio-eyebrow">Product Design · Computational Experiments · Personal Lab</div>
    <div class="page-head">
      <div><h2 class="page-title">Portfolio</h2><p class="page-intro" id="portfolio-intro">Selected works, objects, and experiments.</p></div>
      <div class="count" id="portfolio-count"></div>
    </div>
    <section id="works" class="works" aria-live="polite"></section>
  </div>
<script>
function normalizeSite(site={}){return{name:site.name||'MASATO NASU',tagline:site.tagline||'Product Design · Computational Experiments · Personal Lab',portfolioIntro:site.portfolioIntro||'Selected works, objects, and experiments.'};}
function escapeHtml(value=''){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function normalizeTags(tags){if(Array.isArray(tags))return tags.filter(Boolean).map(String);if(typeof tags==='string')return tags.split(',').map(s=>s.trim()).filter(Boolean);return[];}
async function loadSiteData(){const candidates=['/api/data','./data.json','data.json'];let lastError=null;for(const url of candidates){try{const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error('Failed to load '+url);return await res.json();}catch(error){lastError=error;}}throw lastError||new Error('Failed to load data');}
function normalizeKey(value=''){return String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,'');}
function shouldNoImageIndex(item={}){if(item.noImageIndex===true)return true;const key=normalizeKey(item.title||'');return key==='smott'||key==='airnium';}
function shouldNoSnippet(item={}){if(item.noSnippet===true)return true;const key=normalizeKey(item.title||'');return key==='smott'||key==='airnium';}
function slugify(value=''){return String(value||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]+/g,'-').replace(/^-+|-+$/g,'')||'item';}
function buildSlugs(items){const used=new Map();return items.map((item,index)=>{const raw=shouldNoSnippet(item)?`work-${index+1}`:(item.slug||item.title||`item-${index+1}`);const base=slugify(raw);const count=used.get(base)||0;used.set(base,count+1);return count?`${base}-${count+1}`:base;});}
function ratioOf(item){const r=String(item.imageRatio||'').trim();return['1:1','4:3','3:4','2:3','16:9'].includes(r)?r:'4:3';}
function resolveImagePath(path=''){const p=String(path||'').trim();if(!p)return'';if(/^(https?:|data:|blob:)/i.test(p))return p;if(p.startsWith('/')||p.startsWith('./')||p.startsWith('../'))return p;return'./'+p;}
function buildProtectedImageUrl(path=''){const resolved=resolveImagePath(path);if(!resolved||/^(data:|blob:)/i.test(resolved))return resolved;try{const absolute=new URL(resolved,window.location.href);if(absolute.origin!==window.location.origin)return resolved;}catch{return resolved;}return`/api/image?src=${encodeURIComponent(resolved)}`;}
function workCard(item,slug){const title=escapeHtml(item.title||'Untitled');const year=escapeHtml(item.year||'');const role=escapeHtml(item.role||'');const desc=escapeHtml(item.description||'');const noImageIndex=shouldNoImageIndex(item);const noSnippet=shouldNoSnippet(item);const image=noImageIndex?buildProtectedImageUrl(item.image||''):resolveImagePath(item.image||'');const ratio=ratioOf(item);const tags=normalizeTags(item.tags);const shown=tags.slice(0,3);const extra=Math.max(0,tags.length-shown.length);const tagHtml=shown.length||extra?`<div class="tags">${shown.map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join('')}${extra?`<span class="tag more">+${extra}</span>`:''}</div>`:'';const imageAlt=noSnippet?'Portfolio image':title;const media=image?`<div class="media" data-ratio="${escapeHtml(ratio)}"><img src="${escapeHtml(image)}" alt="${escapeHtml(imageAlt)}" loading="lazy"></div>`:`<div class="media" data-ratio="${escapeHtml(ratio)}"></div>`;const detail=`/portfolio/${encodeURIComponent(slug)}`;const text=`<div class="head"><div><h3 class="title">${title}</h3>${role?`<div class="role">${role}</div>`:''}</div>${year?`<div class="year">${year}</div>`:''}</div>${desc?`<p class="desc">${desc}</p>`:''}${tagHtml}<div class="actions"><a class="read-more" href="${detail}">READ MORE</a></div>`;return`<article class="work-card">${media}<div class="content">${noSnippet?`<div data-nosnippet>${text}</div>`:text}</div></article>`;}
async function main(){const works=document.getElementById('works');try{const data=await loadSiteData();const site=normalizeSite(data.site||{});document.getElementById('site-title').textContent=site.name;document.getElementById('portfolio-eyebrow').textContent=site.tagline;document.getElementById('portfolio-intro').textContent=site.portfolioIntro;document.title=`${site.name} / Portfolio`;const items=Array.isArray(data.portfolio)?data.portfolio:[];document.getElementById('portfolio-count').textContent=`${items.length} WORKS`;if(!items.length){works.innerHTML='<div class="empty">まだポートフォリオ項目がありません。</div>';return;}const slugs=buildSlugs(items);works.innerHTML=items.map((item,index)=>workCard(item,slugs[index])).join('');}catch(error){console.error(error);works.innerHTML='<div class="error">ポートフォリオの読み込みに失敗しました。</div>';}}
main();
</script>
</body>
</html>
