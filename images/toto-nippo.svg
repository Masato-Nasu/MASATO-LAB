<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#e9e4d7"/><rect x="85" y="55" width="1030" height="790" fill="#f8f3e7" stroke="#29271f"/><g fill="#25251f" font-family="serif"><text x="600" y="225" text-anchor="middle" font-size="132" font-weight="bold" letter-spacing="16">東都日報</text><text x="600" y="285" text-anchor="middle" font-size="25" letter-spacing="8">世界はおかしい。新聞は真面目。</text><path d="M135 325H1065M135 333H1065M135 675H1065" stroke="#25251f" stroke-width="3"/><text x="145" y="380" font-size="22">平行世界より、本日の朝刊。</text><text x="145" y="480" font-size="60" font-weight="bold">急行、急がない</text><text x="145" y="565" font-size="60" font-weight="bold">乗客にも開放</text><text x="145" y="630" font-size="24">鉄道局「速さの使い道はお客様が決める」</text><text x="145" y="735" font-size="22">FICTION / BYOK / DAILY NEWSPAPER</text><text x="145" y="790" font-size="20">TOTO NIPPO — A NEWSPAPER FROM ANOTHER WORLD</text></g><rect x="910" y="380" width="110" height="230" fill="none" stroke="#a5382b" stroke-width="4"/><text x="965" y="445" text-anchor="middle" fill="#a5382b" font-size="38" font-family="serif"><tspan x="965">架</tspan><tspan x="965" dy="62">空</tspan><tspan x="965" dy="62">版</tspan></text></svg>