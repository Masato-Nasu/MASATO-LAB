<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MASATO NASU</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --panel: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #d8d8d2;
      --shadow: 0 10px 28px rgba(0,0,0,.06);
      --radius: 24px;
      --max: 1180px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }
    body {
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    .wrap {
      max-width: var(--max);
      margin: 0 auto;
      padding: 22px 20px 56px;
    }
    .site-header {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .site-title {
      margin: 0;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 0.98;
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 15px;
      padding-bottom: 10px;
    }
    .nav a[aria-current="page"] { font-weight: 700; }
    .hero {
      margin: 28px 0 34px;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .hero h2 {
      margin: 0 0 8px;
      font-size: clamp(34px, 6vw, 68px);
      line-height: .98;
      letter-spacing: -.04em;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      white-space: pre-wrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 22px;
      min-height: 180px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(0,0,0,.08);
    }
    .card-title {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.02;
      letter-spacing: -.03em;
    }
    .card-text {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .hero { padding: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1 class="site-title" id="site-title">MASATO NASU</h1>
      <nav class="nav" aria-label="Primary">
        <a href="./index.html" aria-current="page">Home</a>
        <a href="./portfolio.html">Portfolio</a>
        <a href="./memory.html">Peripheral Memory</a>
        <a href="./tools.html">Tools</a>
        <a href="./about.html">About</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="home-title">
      <h2 id="home-title">Home</h2>
      <p id="home-copy">Portfolio / Peripheral Memory / Tools へ移動できます。</p>
    </section>

    <section class="grid" aria-label="Site sections">
      <a class="card" href="./portfolio.html">
        <h3 class="card-title">Portfolio</h3>
        <p class="card-text">作品一覧を見る。</p>
      </a>
      <a class="card" href="./memory.html">
        <h3 class="card-title">Peripheral Memory</h3>
        <p class="card-text">記録とリンクを見る。</p>
      </a>
      <a class="card" href="./tools.html">
        <h3 class="card-title">Tools</h3>
        <p class="card-text">アプリとツールを見る。</p>
      </a>
    </section>
  </div>

  <script>
    const siteTitle = document.getElementById('site-title');
    const homeCopy = document.getElementById('home-copy');

    async function loadSiteData() {
      try {
        const apiResponse = await fetch('/api/data', { cache: 'no-store' });
        if (apiResponse.ok) return await apiResponse.json();
      } catch (error) {
        console.warn('API data unavailable, trying local fallback.', error);
      }
      const fallbackResponse = await fetch('./data.json', { cache: 'no-store' });
      if (!fallbackResponse.ok) throw new Error('Failed to load fallback data.json');
      return await fallbackResponse.json();
    }

    async function boot() {
      try {
        const data = await loadSiteData();
        const site = data.site || {};
        if (site.name) {
          siteTitle.textContent = site.name;
          document.title = site.name;
        }
        if (site.about) {
          homeCopy.textContent = String(site.about).split('\n')[0];
        }
      } catch (error) {
        console.error(error);
      }
    }

    boot();
  </script>
</body>
</html>
